<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flowloud Popup Interaction QA v6</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:28px;font:14px/1.5 "Segoe UI","Microsoft YaHei UI",sans-serif;color:#0f1f3d;background:#eef3f9}
    h1{margin:0 0 20px;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{padding:18px;border:1px solid #dbe4f0;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(15,31,61,.08)}
    .panel h2{margin:0 0 12px;font-size:14px}.stage{display:grid;min-height:620px;place-items:center;overflow:hidden;border-radius:12px;background:#fff}.stage img{display:block;max-width:100%;max-height:620px;object-fit:contain}
    .note{margin:12px 0 0;color:#64748b;font-size:12px}
  </style>
</head>
<body>
  <h1>Popup：目标视觉 / 阅读方式 / 外观与快捷键交互</h1>
  <div class="grid">
    <section class="panel"><h2>已批准目标图</h2><div class="stage"><img src="../../design-references/flowloud-popup-approved.png" alt="已批准的 Flowloud Popup 目标图"></div><p class="note">蓝白中性视觉、高频操作固定、详细设置就地展开。</p></section>
    <section class="panel"><h2>阅读方式说明</h2><div class="stage"><img src="popup-reading-modes-v6.png" alt="页面导览模式的用途说明"></div><p class="note">选择不同模式时，界面直接说明连续正文与语义导览的区别。</p></section>
    <section class="panel"><h2>阅读外观</h2><div class="stage"><img src="popup-appearance-interaction-v6.png" alt="可交互的阅读外观设置"></div><p class="note">句子聚焦与逐词效果可在 Popup 内修改并即时保存。</p></section>
    <section class="panel"><h2>快捷键</h2><div class="stage"><img src="popup-shortcuts-v6.png" alt="Popup 内快捷键详情"></div><p class="note">从“更多”进入并可返回，不再是无响应的静态菜单。</p></section>
  </div>
</body>
</html>
