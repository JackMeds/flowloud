<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flowloud Popup Design QA v5</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:28px;font:14px/1.5 "Segoe UI","Microsoft YaHei UI",sans-serif;color:#0f1f3d;background:#eef3f9}
    h1{margin:0 0 20px;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{padding:18px;border:1px solid #dbe4f0;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(15,31,61,.08)}
    .panel h2{margin:0 0 12px;font-size:14px}.stage{display:grid;min-height:620px;place-items:center;overflow:hidden;border-radius:12px;background:#fff}.stage img{display:block;max-width:100%;max-height:620px;object-fit:contain}
    .note{margin:12px 0 0;color:#64748b;font-size:12px}
  </style>
</head>
<body>
  <h1>Popup 与悬浮播放器：目标图 / 当前实现同屏对照</h1>
  <div class="grid">
    <section class="panel"><h2>已批准目标图</h2><div class="stage"><img src="../../design-references/flowloud-popup-approved.png" alt="已批准的 Flowloud Popup 与悬浮播放器目标图"></div><p class="note">保持蓝白中性视觉、固定播放器与高频快捷操作。</p></section>
    <section class="panel"><h2>当前 Popup</h2><div class="stage"><img src="popup-top-tabs-v5.png" alt="使用固定顶部分段导航的 Flowloud Popup"></div><p class="note">声音、阅读、配音、更多原位切换；当前页完整展示且不使用内部滚动。</p></section>
    <section class="panel"><h2>当前 Storybook 悬浮播放器</h2><div class="stage"><img src="floating-player-compact-v5.png" alt="紧凑的 Flowloud 悬浮播放器"></div><p class="note">单一收起入口；五个播放控制保持 44px 可点击区域。</p></section>
    <section class="panel"><h2>真实网页运行状态</h2><div class="stage"><img src="reader-floating-player-compact-v5.png" alt="真实网页中运行的 Flowloud 悬浮播放器"></div><p class="note">生产版播放器与 Storybook 的尺寸、结构和高亮状态一致。</p></section>
  </div>
</body>
</html>
