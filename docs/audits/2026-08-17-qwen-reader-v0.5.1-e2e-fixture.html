<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen Reader v0.5.1 本地 E2E 验收</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(680px, calc(100% - 48px));
      padding: 40px;
      border: 1px solid #d8e0ec;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 16px 40px rgba(31, 52, 84, 0.12);
    }

    h1 {
      margin: 0 0 28px;
      font-size: 28px;
      letter-spacing: 0.02em;
    }

    p {
      margin: 14px 0;
      padding: 18px 20px;
      border-radius: 12px;
      font-size: 22px;
      line-height: 1.5;
    }

    .sunrise { background: #fff3d6; }
    .number { background: #e5f1ff; }
    .ready { background: #e5f8ed; }
  </style>
</head>
<body>
  <main>
    <h1>Qwen Reader v0.5.1 本地 E2E 验收</h1>
    <p class="sunrise">一、清晨的风很轻。</p>
    <p class="number">二、测试编号是四十二。</p>
    <p class="ready">三、朗读已准备好。</p>
  </main>
</body>
</html>
