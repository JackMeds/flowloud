<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen Reader UI Harness</title>
  <style>
    body { margin: 0; font: 16px/1.7 system-ui, sans-serif; background: #f5f6fa; }
    main { max-width: 760px; margin: 56px auto; padding: 28px; background: white; border-radius: 18px; }
    #test-result { position: fixed; left: 12px; top: 12px; z-index: 999999; padding: 6px 12px; border-radius: 999px; background: #fff; }
  </style>
</head>
<body>
  <output id="test-result">RUNNING</output>
  <main>
    <h1>女生开发记录 &amp; 各种碎碎念</h1>
    <article class="Post" data-qwen-source="post-1">
      <h3>oprin</h3>
      <div class="Post-body">今天继续记录一下最近的变化，也当作留给未来的备忘。</div>
    </article>
    <article class="Post" data-qwen-source="post-2">
      <h3>LeR</h3>
      <div class="Post-body">很短的回复。</div>
    </article>
  </main>
  <script>
    window.__qrHarness = {
      extractCalls: 0,
      synthCalls: 0,
      audioPlays: 0,
      storageListener: null,
      readerMessageListener: null,
      storageSets: 0,
      lastAudio: null
    };
    window.__QWEN_READER_TEST__ = true;
    window.Audio = class HarnessAudio {
      constructor(src) { this.src = src; this.listeners = new Map(); window.__qrHarness.lastAudio = this; }
      addEventListener(type, listener) { this.listeners.set(type, listener); }
      async play() { window.__qrHarness.audioPlays += 1; }
      pause() {}
      removeAttribute(name) { if (name === "src") this.src = ""; }
      load() {}
    };
    window.QwenReaderDefaults = {
      SETTINGS_KEY: "qwenReaderSettings",
      DEFAULT_SETTINGS: { preset: "op-exclusive", opVoice: "邵思萌", replyVoices: ["音色B", "音色C"] }
    };
    window.QwenReaderText = { splitText(text) { return [text]; } };
    window.QwenReaderExtractors = {
      async extractPage() {
        window.__qrHarness.extractCalls += 1;
        const segments = [
          {id:"p1", floor:1, authorId:"op", authorName:"oprin", isOp:true, text:"今天继续记录一下最近的变化。", sourceKey:"post-1", sourceSelector:"article[data-qwen-source='post-1']"},
          {id:"p2", floor:2, authorId:"ler", authorName:"LeR", isOp:false, text:"很短的回复。", sourceKey:"post-2", sourceSelector:"article[data-qwen-source='post-2']"}
        ];
        if (document.querySelector('[data-dynamic-reply]')) {
          segments.push({id:"p3", floor:3, authorId:"new", authorName:"新回复", isOp:false, text:"播放期间动态加载的回复", sourceKey:"post-3"});
        }
        return segments;
      }
    };
    window.chrome = {
      runtime: {
        getURL(path) { return "../../" + path; },
        sendMessage(message) {
          if (message.type === "tts:synthesize") {
            window.__qrHarness.synthCalls += 1;
            return Promise.resolve({ok:true, audioBase64:"UklGRg==", mimeType:"audio/wav"});
          }
          return Promise.resolve({ok:true});
        },
        onMessage: {
          addListener(listener) { window.__qrHarness.readerMessageListener = listener; }
        }
      },
      storage: {
        onChanged: { addListener(listener) { window.__qrHarness.storageListener = listener; } },
        local: {
          get() { return Promise.resolve({}); },
          set() { window.__qrHarness.storageSets += 1; return Promise.resolve(); }
        }
      }
    };
    window.__sendReaderMessage = function(message) {
      const listener = window.__qrHarness.readerMessageListener;
      if (!listener) return Promise.reject(new Error("reader message listener missing"));
      return new Promise((resolve) => {
        const keptOpen = listener(message, {}, resolve);
        if (keptOpen !== true) resolve(undefined);
      });
    };
  </script>
  <script src="../../shared/normalized-document.js"></script>
  <script src="../../shared/voice-assignment.js"></script>
  <script src="../../shared/player-state.js"></script>
  <script src="../../content/reader.js"></script>
  <script>
    addEventListener("load", async () => {
      await new Promise(resolve => setTimeout(resolve, 250));
      const result = document.querySelector("#test-result");
      try {
        const host = document.querySelector("#qwen-reader-host");
        if (!host) throw new Error("Shadow DOM host missing");
        if (host.shadowRoot !== null) throw new Error("production Shadow DOM must be closed");
        const root = window.__QWEN_READER_TEST_ROOT__;
        if (!root) throw new Error("test-only Shadow DOM hook missing");
        if (root.querySelector(".qr-orb, .qr-panel, [role=tablist]")) {
          throw new Error("legacy floating orb or sidebar still rendered");
        }
        const mini = root.querySelector(".qr-mini-player");
        if (!mini || mini.classList.contains("is-visible")) {
          throw new Error("mini player must exist but stay hidden before playback");
        }
        if (window.__qrHarness.extractCalls !== 1) throw new Error("initial page scan should run exactly once");
        if (window.__qrHarness.synthCalls !== 0) throw new Error("initial page scan must not synthesize audio");

        const initial = await window.__sendReaderMessage({type:"reader:snapshot:get"});
        if (!initial.ok || initial.snapshot.segmentCount !== 2 || !initial.snapshot.hasMultipleAuthors) {
          throw new Error("compact reader snapshot lost page author context");
        }
        if (!initial.snapshot.pageKey || !Number.isInteger(initial.snapshot.revision)) {
          throw new Error("snapshot must include pageKey and revision");
        }
        const pageKey = initial.snapshot.pageKey;

        const legacyToggle = await window.__sendReaderMessage({type:"ui:toggle"});
        if (legacyToggle !== undefined || window.__qrHarness.synthCalls !== 0) {
          throw new Error("legacy ui:toggle must not remain as an independent control path");
        }
        const unboundCommand = await window.__sendReaderMessage({
          type:"reader:command", command:"play"
        });
        if (unboundCommand.ok || unboundCommand.error !== "page_context_mismatch") {
          throw new Error("page-bound commands must include the current page key");
        }
        const wrongPageCommand = await window.__sendReaderMessage({
          type:"reader:command", command:"play", pageKey:"https://example.invalid/stale"
        });
        if (wrongPageCommand.ok || wrongPageCommand.error !== "page_context_mismatch") {
          throw new Error("page-bound commands must reject a stale page key");
        }

        const play = await window.__sendReaderMessage({type:"reader:command", command:"play", pageKey});
        if (!play.ok || play.snapshot.status !== "playing") throw new Error("reader command did not start playback");
        if (!mini.classList.contains("is-visible")) throw new Error("mini player did not appear during playback");
        if (!document.querySelector(".qwen-reader-speaking")) throw new Error("current paragraph highlight disappeared");
        if (!root.querySelector('[data-action="previous"], [data-action="next"], [data-action="stop"]')) {
          throw new Error("mini player controls missing");
        }

        const speed = await window.__sendReaderMessage({type:"reader:command", command:"set-speed", value:"1.2", pageKey});
        if (!speed.ok || speed.snapshot.speed !== 1.2 || window.__qrHarness.lastAudio.playbackRate !== 1.2) {
          throw new Error("temporary playback speed was not applied to the current audio");
        }

        root.querySelector('[data-action="play-toggle"]').click();
        await new Promise(resolve => setTimeout(resolve, 30));
        if (!mini.classList.contains("is-visible") || mini.dataset.state !== "paused") {
          throw new Error("mini player should remain available while paused");
        }

        const pageContext = await window.__sendReaderMessage({type:"reader:page-context:get"});
        if (Object.keys(pageContext.pageContext.authorVoices).length) {
          throw new Error("global assignments must not be reported as page overrides");
        }
        if (!pageContext.pageContext.authors.every(author => author.effectiveVoice && !("voice" in author))) {
          throw new Error("page context must separate effective voices from explicit overrides");
        }
        const applied = await window.__sendReaderMessage({
          type:"reader:page-context:apply",
          context: {
            pageKey: pageContext.pageContext.pageKey,
            authorVoices: {"id:op":"音色C", "id:ler":"音色D"}
          }
        });
        if (!applied.ok || applied.pageContext.authorVoices["id:op"] !== "音色C") {
          throw new Error("page author voice context was not applied");
        }
        if (window.__qrHarness.storageSets !== 0) {
          throw new Error("page author context must not write global settings");
        }
        const overridden = await window.__sendReaderMessage({type:"reader:snapshot:get"});
        if (!overridden.snapshot.authorSummary.some(item => item.key === "id:op" && item.voice === "音色C")) {
          throw new Error("page author override did not take precedence in snapshot");
        }

        const mismatch = await window.__sendReaderMessage({
          type:"reader:page-context:apply",
          context: {pageKey:"https://example.invalid/other", authorVoices:{"id:op":"不应应用"}}
        });
        if (mismatch.ok || mismatch.error.code !== "page_context_mismatch") {
          throw new Error("page context must be scoped to the active page");
        }

        await window.__sendReaderMessage({type:"reader:command", command:"play", pageKey});
        const dynamicReply = document.createElement("p");
        dynamicReply.textContent = "播放期间动态加载的回复";
        dynamicReply.dataset.dynamicReply = "true";
        document.querySelector("main").append(dynamicReply);
        await new Promise(resolve => setTimeout(resolve, 30));
        await window.__sendReaderMessage({type:"reader:command", command:"stop", pageKey});
        await new Promise(resolve => setTimeout(resolve, 1000));
        const afterDynamic = await window.__sendReaderMessage({type:"reader:snapshot:get"});
        if (window.__qrHarness.extractCalls !== 2 || afterDynamic.snapshot.segmentCount !== 3) {
          throw new Error("dynamic content added during playback was not rescanned after stop");
        }
        if (mini.classList.contains("is-visible") || document.querySelector(".qwen-reader-speaking")) {
          throw new Error("stop must hide the mini player and clear page highlight");
        }

        history.pushState({}, "", `?topic=${Date.now()}`);
        const synthesisBeforeStaleCommand = window.__qrHarness.synthCalls;
        const staleAfterNavigation = await window.__sendReaderMessage({
          type:"reader:command", command:"play", pageKey
        });
        if (
          staleAfterNavigation.ok ||
          staleAfterNavigation.error !== "page_context_mismatch" ||
          window.__qrHarness.synthCalls !== synthesisBeforeStaleCommand
        ) {
          throw new Error("a stale popup command controlled the new SPA route");
        }
        await new Promise(resolve => setTimeout(resolve, 1300));
        const afterNavigation = await window.__sendReaderMessage({type:"reader:page-context:get"});
        if (window.__qrHarness.extractCalls !== 3 || Object.keys(afterNavigation.pageContext.authorVoices).length) {
          throw new Error("SPA navigation should rescan and clear old page-only assignments");
        }
        result.value = "PASS";
        result.style.background = "#d9fbe7";
        document.documentElement.dataset.testStatus = "pass";
      } catch (error) {
        result.value = "FAIL: " + error.message;
        result.style.background = "#ffe0e0";
        document.documentElement.dataset.testStatus = "fail";
      }
    });
  </script>
</body>
</html>
