<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flowloud 页面导览</title><link rel="stylesheet" href="design-system.css"><link rel="stylesheet" href="page-guide.css"></head>
<body><header><div><p>FLOWLOUD / 流声</p><h1>页面导览</h1><p id="page-title">正在读取页面…</p></div><button id="refresh" type="button">刷新大纲</button></header>
<nav aria-label="导览类型"><label>筛选 <select id="filter"><option value="all">全部</option><option value="landmark">区域</option><option value="heading">标题</option><option value="paragraph">段落</option><option value="list">列表</option><option value="table">表格</option><option value="link">链接</option><option value="button">按钮</option><option value="form">表单</option><option value="image">图片</option></select></label><button id="previous" type="button">上一项</button><button id="read" type="button">朗读当前项</button><button id="next" type="button">下一项</button></nav>
<p class="notice">本功能只导航和朗读，不点击链接、不触发按钮、不修改表单，也不替代读屏软件。</p><main><ol id="outline" aria-live="polite"></ol></main><script src="page-guide.js"></script></body></html>
